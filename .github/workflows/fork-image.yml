name: Fork image

# Publishes the patched fork to GHCR (amd64 only; add docker/setup-qemu-action
# and `platforms: linux/amd64,linux/arm64` for an ARM host):
#   ghcr.io/<owner>/webmail-lite:latest   static build behind nginx (Dockerfile.lite)
#   ghcr.io/<owner>/webmail:latest        full Node.js edition (Dockerfile)
# Optional repository variable JMAP_SERVER_URL is baked into the Lite image's
# config.json as its default server.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: -lite
            dockerfile: Dockerfile.lite
          - suffix: ""
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}${{ matrix.suffix }}:latest
            ghcr.io/${{ github.repository }}${{ matrix.suffix }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ${{ matrix.suffix == '-lite' && format('LITE_JMAP_SERVER_URL={0}', vars.JMAP_SERVER_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
