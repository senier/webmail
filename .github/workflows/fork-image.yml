name: Fork image

# Builds the patched fork and publishes ghcr.io/<owner>/webmail:latest (+ :<sha>).
# Single-arch (amd64) to keep builds fast; add `platforms: linux/amd64,linux/arm64`
# plus docker/setup-qemu-action if the host is ARM.

on:
  push:
    branches:
      - feature/hide-unsubscribed-mailboxes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
